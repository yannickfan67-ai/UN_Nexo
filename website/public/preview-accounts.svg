<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720">
<rect width="1180" height="720" fill="#0B0F14"/><rect width="238" height="720" fill="#0E141C"/><rect x="237" width="1" height="720" fill="#1D2732"/>
<g font-family="Inter,Segoe UI,sans-serif"><text x="18" y="42" fill="#F4F7FB" font-size="26" font-weight="600">UN_Nexo</text><text x="18" y="66" fill="#8E9AAA" font-size="14">Minecraft Launcher</text>
<rect x="18" y="202" width="202" height="42" rx="9" fill="#151D2A"/>
<g fill="#E8EDF4" font-size="15"><text x="32" y="134">Home</text><text x="32" y="181">Instances</text><text x="32" y="228">Accounts</text><text x="32" y="275" opacity=".35">Downloads</text><text x="32" y="322">Settings</text></g>
<rect x="18" y="628" width="202" height="74" rx="10" fill="#111923"/><text x="32" y="655" fill="#F4F7FB" font-size="14" font-weight="600">v0.7.9-dev</text><text x="32" y="680" fill="#8E9AAA" font-size="12">Ready.</text></g>
<g font-family="Inter,Segoe UI,sans-serif"><text x="268" y="58" fill="#F4F7FB" font-size="32" font-weight="600">Accounts</text><text x="268" y="86" fill="#8E9AAA" font-size="14">Manage authenticated Microsoft accounts for Minecraft launch.</text><rect x="1020" y="34" width="120" height="42" rx="9" fill="#151D2A" stroke="#2A3543"/><text x="1037" y="60" fill="#F4F7FB" font-size="13">Back to home</text>
<rect x="268" y="118" width="230" height="550" rx="14" fill="#121923" stroke="#202B38"/><text x="286" y="150" fill="#F4F7FB" font-size="17" font-weight="600">Profiles</text><rect x="282" y="178" width="202" height="62" rx="8" fill="#151D2A"/><text x="296" y="203" fill="#F4F7FB" font-size="14" font-weight="600">Steve</text><text x="296" y="225" fill="#8E9AAA" font-size="11">Microsoft</text><rect x="282" y="250" width="202" height="62" rx="8" fill="#0E141C"/><text x="296" y="275" fill="#F4F7FB" font-size="14" font-weight="600">Microsoft profile</text><text x="296" y="297" fill="#8E9AAA" font-size="11">Microsoft</text><text x="286" y="638" fill="#8E9AAA" font-size="11">Authenticated Microsoft profiles only.</text>
<rect x="518" y="118" width="622" height="220" rx="14" fill="#121923" stroke="#202B38"/><text x="540" y="152" fill="#F4F7FB" font-size="19" font-weight="600">Authenticated launch</text><text x="540" y="179" fill="#8E9AAA" font-size="12">Minecraft launch requires Microsoft/Xbox/Minecraft Services authentication.</text><rect x="540" y="207" width="578" height="42" rx="7" fill="#0E141C" stroke="#293344"/><text x="556" y="233" fill="#667488" font-size="13">No unauthenticated fallback is provided</text><rect x="540" y="266" width="160" height="43" rx="8" fill="#6D5DFB"/><text x="559" y="292" fill="#fff" font-size="13" font-weight="600">Authentication required</text>
<rect x="518" y="356" width="622" height="312" rx="14" fill="#121923" stroke="#202B38"/><text x="540" y="390" fill="#F4F7FB" font-size="19" font-weight="600">Microsoft account</text><text x="540" y="418" fill="#8E9AAA" font-size="12">Sign in through the system browser and keep refresh credentials in the OS-backed cache.</text><rect x="540" y="446" width="180" height="43" rx="8" fill="#6D5DFB"/><text x="560" y="472" fill="#fff" font-size="13" font-weight="600">Sign in with Microsoft</text><rect x="732" y="446" width="150" height="43" rx="8" fill="#151D2A" stroke="#293344"/><text x="754" y="472" fill="#F4F7FB" font-size="13">Sign out selected</text><rect x="894" y="446" width="120" height="43" rx="8" fill="#151D2A" stroke="#293344"/><text x="917" y="472" fill="#F4F7FB" font-size="13">How it works</text><rect x="540" y="515" width="578" height="118" rx="9" fill="#0E141C"/><text x="558" y="546" fill="#8E9AAA" font-size="12">Nexo uses its own public Microsoft Client ID with the system browser,</text><text x="558" y="570" fill="#8E9AAA" font-size="12">then exchanges the Microsoft session through Xbox Live/XSTS and</text><text x="558" y="594" fill="#8E9AAA" font-size="12">Minecraft Services. accounts.json stores profile metadata only.</text></g></svg>