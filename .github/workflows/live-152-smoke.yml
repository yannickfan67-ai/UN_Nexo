name: live-1.5.2-smoke

on:
  push:
    branches: [ test/live-152-smoke ]

jobs:
  minecraft-152:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install X11/OpenGL/audio compatibility libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libx11-6 libxext6 libxi6 libxrandr2 libxcursor1 \
            libgl1 libasound2t64 libopenal1 libfontconfig1
      - name: Download and launch real Minecraft 1.5.2
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a dotnet run \
            --project tests/UN.Nexo.Live152Smoke/UN.Nexo.Live152Smoke.csproj \
            -c Release 2>&1 | tee live-152-smoke.log
      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-152-smoke-log
          path: live-152-smoke.log
          if-no-files-found: ignore
          retention-days: 7
