name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Display .NET version
        run: dotnet --version
      - name: Restore
        run: dotnet restore UN_Nexo.sln
      - name: Build
        run: dotnet build UN_Nexo.sln -c Release --no-restore
