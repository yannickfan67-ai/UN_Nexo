name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Display .NET version
        run: dotnet --version
      - name: Restore
        run: dotnet restore UN_Nexo.sln
      - name: Build
        run: dotnet build UN_Nexo.sln -c Release --no-restore
      - name: Core regression checks
        run: dotnet run --project tests/UN.Nexo.Core.Tests/UN.Nexo.Core.Tests.csproj -c Release --no-build
      - name: Diagnostics regression checks
        run: dotnet run --project tests/UN.Nexo.Diagnostics.Tests/UN.Nexo.Diagnostics.Tests.csproj -c Release
      - name: Server status regression checks
        run: dotnet run --project tests/UN.Nexo.ServerStatus.Tests/UN.Nexo.ServerStatus.Tests.csproj -c Release
      - name: Instance lifecycle regression checks
        run: dotnet run --project tests/UN.Nexo.InstanceLifecycle.Tests/UN.Nexo.InstanceLifecycle.Tests.csproj -c Release
      - name: Game directory import regression checks
        run: dotnet run --project tests/UN.Nexo.Import.Tests/UN.Nexo.Import.Tests.csproj -c Release
      - name: Stability regression checks
        run: dotnet run --project tests/UN.Nexo.Stability.Tests/UN.Nexo.Stability.Tests.csproj -c Release
      - name: Instance repair regression checks
        run: dotnet run --project tests/UN.Nexo.Repair.Tests/UN.Nexo.Repair.Tests.csproj -c Release

  windows-portable:
    timeout-minutes: 20
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained Windows x64 build
        shell: pwsh
        run: >-
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/win-x64

      - name: Add Windows test instructions
        shell: pwsh
        run: |
          @'
          UN_Nexo Windows x64 portable test build

          1. Extract this archive.
          2. Run UN_Nexo.exe.
          3. This build is self-contained; installing the .NET runtime is not required.
          4. If launcher startup hangs, inspect:
             %APPDATA%\UN_Nexo\logs\startup-latest.log
             Fallback: %TEMP%\UN_Nexo\startup-latest.log
          '@ | Set-Content -Encoding UTF8 artifacts/win-x64/RUN-ON-WINDOWS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: UN_Nexo-win-x64-portable
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 14

  linux-desktop-smoke:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained Linux x64 build
        run: >-
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/linux-x64

      - name: Install virtual X server
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Smoke launch desktop UI
        shell: bash
        run: |
          set +e
          timeout 8s xvfb-run -a ./artifacts/linux-x64/UN_Nexo
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "UN_Nexo exited unexpectedly with code $code"
            exit "$code"
          fi
          echo "UN_Nexo stayed alive under X11 virtual display."

      - name: Add Linux Mint test instructions
        run: |
          cat > artifacts/linux-x64/RUN-ON-LINUX-MINT.txt <<'EOF'
          UN_Nexo Linux Mint test build

          1. Extract this archive.
          2. Open a terminal in the extracted folder.
          3. Run: chmod +x UN_Nexo
          4. Run: ./UN_Nexo

          This build is self-contained: installing the .NET runtime is not required.
          The launcher bundles its own CJK fallback font. Linux Mint still needs its normal desktop libraries (X11/fontconfig/etc.), which are present on a standard Cinnamon installation.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: UN_Nexo-linux-x64-mint-test
          path: artifacts/linux-x64/
          if-no-files-found: error
          retention-days: 14
