name: release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-core:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run launch and download regression checks
        run: dotnet run --project tests/UN.Nexo.Core.Tests/UN.Nexo.Core.Tests.csproj -c Release
      - name: Run stability regression checks
        run: dotnet run --project tests/UN.Nexo.Stability.Tests/UN.Nexo.Stability.Tests.csproj -c Release
      - name: Run instance repair regression checks
        run: dotnet run --project tests/UN.Nexo.Repair.Tests/UN.Nexo.Repair.Tests.csproj -c Release

  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64 single-file build
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force release | Out-Null
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64
          Copy-Item publish/win-x64/UN_Nexo.exe "release/UN_Nexo-$version-win-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  build-linux-packages:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Linux x64 build
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/linux-x64
      - name: Install package tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm xvfb
          sudo gem install --no-document fpm
      - name: Build DEB and RPM packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          BASE_VERSION="${VERSION%%-*}"
          ITERATION="${VERSION#*-}"
          if [ "$ITERATION" = "$VERSION" ]; then ITERATION="1"; fi
          mkdir -p package-root/usr/lib/un-nexo package-root/usr/bin package-root/usr/share/applications release
          cp -a publish/linux-x64/. package-root/usr/lib/un-nexo/
          find package-root/usr/lib/un-nexo -name '*.pdb' -delete
          chmod 0755 package-root/usr/lib/un-nexo/UN_Nexo
          cat > package-root/usr/bin/un-nexo <<'EOF'
          #!/bin/sh
          exec /usr/lib/un-nexo/UN_Nexo "$@"
          EOF
          chmod 0755 package-root/usr/bin/un-nexo
          cat > package-root/usr/share/applications/un-nexo.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=UN_Nexo
          Comment=Modern Minecraft launcher
          Exec=un-nexo
          Terminal=false
          Categories=Game;Utility;
          StartupNotify=true
          StartupWMClass=UN_Nexo
          EOF
          fpm -s dir -t deb -n un-nexo -v "$BASE_VERSION" --iteration "$ITERATION" -a amd64 \
            --description "UN_Nexo - a modern, lightweight and extensible Minecraft launcher" \
            --url "https://github.com/yannickfan67-ai/UN_Nexo" --maintainer "UN_Nexo project" \
            -d 'libc6 (>= 2.35)' -d libgcc-s1 -d libstdc++6 \
            -d libfontconfig1 -d fontconfig -d libfreetype6 -d fonts-noto-cjk \
            -d libx11-6 -d libx11-xcb1 -d libxcb1 -d libxext6 \
            -d libxi6 -d libxtst6 -d libxrandr2 -d libxcursor1 -d libgl1 -d libice6 -d libsm6 \
            -C package-root -p "release/UN_Nexo-${VERSION}-linux-x64.deb" .
          fpm -s dir -t rpm -n un-nexo -v "$BASE_VERSION" --iteration "$ITERATION" -a x86_64 \
            --description "UN_Nexo - a modern, lightweight and extensible Minecraft launcher" \
            --url "https://github.com/yannickfan67-ai/UN_Nexo" --maintainer "UN_Nexo project" \
            -d glibc -d libgcc -d libstdc++ -d fontconfig -d freetype -d google-noto-sans-cjk-fonts \
            -d libX11 -d libXcursor -d libXi -d libXtst -d libXrandr -d libXext -d mesa-libGL -d libICE -d libSM \
            -C package-root -p "release/UN_Nexo-${VERSION}-linux-x64.rpm" .
      - name: Validate DEB dependencies and CJK fallback with APT
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          DEB="UN_Nexo-${VERSION}-linux-x64.deb"
          echo "Declared dependencies:"
          dpkg-deb -f "release/$DEB" Depends
          docker run --rm -v "$PWD/release:/packages:ro" ubuntu:24.04 bash -lc \
            "apt-get update >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/$DEB >/dev/null && dpkg-query -W -f='\${Status}\n' un-nexo | grep -q 'install ok installed' && dpkg-query -W -f='\${Status}\n' libxtst6 | grep -q 'install ok installed' && ldconfig -p | grep -q 'libXtst.so.6' && fc-match 'Noto Sans CJK SC' | grep -qi 'NotoSansCJK'"
      - name: Smoke test packaged DEB UI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          rm -rf smoke-root smoke-data
          mkdir -p smoke-root smoke-data
          dpkg-deb -x "release/UN_Nexo-${VERSION}-linux-x64.deb" smoke-root
          set +e
          timeout 8s xvfb-run -a env XDG_DATA_HOME="$PWD/smoke-data" "$PWD/smoke-root/usr/lib/un-nexo/UN_Nexo" >package-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then cat package-smoke.log; exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    needs: [test-core, build-windows, build-linux-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION}"
          cat > RELEASE_NOTES.md <<EOF
          ## UN_Nexo ${VERSION}

          ### Instance check and repair
          - Adds a dedicated Repair utility for the selected Vanilla instance
          - Checks install state, version metadata, client JAR, libraries, asset index and objects, extracted natives, required Java and Linux libXtst
          - Verifies Mojang SHA-1 metadata and rejects unsafe metadata paths or malformed hashes
          - Reuses verified files and reacquires only missing or corrupt Vanilla components
          - Rebuilds historical virtual assets and current pre-1.6 resource mappings after object repair
          - Keeps worlds, mods, resource packs, screenshots and ordinary game configuration outside the repair write set

          ### Reliability carried forward
          - Bounds stalled response bodies and falls back from an idle mirror to the official Minecraft source
          - Preserves explicit user cancellation instead of silently retrying it
          - Validates cached Nexo-managed Java before reuse and reacquires damaged runtimes
          - Preserves launch failure, stop and exit results instead of immediately overwriting them with Ready
          - Adds the Linux libXtst runtime dependency needed by Java 8 / LWJGL 2 launch paths
          - Release CI now runs launch/download, stability and repair regressions before publishing

          ### Compatibility carried forward
          - Automatic SHA-256-verified Eclipse Temurin acquisition when the required Java major is missing
          - Modern 1.21.4, legacy 1.8.9 and real Minecraft 1.5.2 launch paths
          - Minecraft 1.5.2 pre-1.6 resource mapping plus LaunchWrapper and LWJGL 2 compatibility
          - Official/BMCLAPI downloads with official fallback and hash verification
          - Server Hub favorites with modern Quick Play and legacy direct-connect launch paths
          - Persistent launch tracing and Java process heartbeat diagnostics

          ### Font and Linux compatibility
          - Bundles Avalonia Inter for a reliable baseline UI font
          - Debian/Mint packages require Noto CJK, full fontconfig support and libXtst
          - Release CI installs the final DEB in a clean Ubuntu 24.04 container, validates libXtst and Noto CJK resolution, and launches the packaged UI under Xvfb
          - Windows and Linux packages remain self-contained for the .NET runtime

          ### Current limitations
          - Microsoft account sign-in is not enabled yet while UN_Nexo obtains its own approved application registration
          - Repair currently targets Vanilla instance contents; loader-specific repair will arrive with loader support
          - Runtime overrides are currently global; per-instance memory/JVM overrides are not implemented yet
          - Friend-to-friend room-code/P2P networking is not included yet
          - Fabric, Forge and NeoForge installers are not included yet
          - HTTP Range resume and mod/resource-pack/shader management are not implemented yet
          - Real Linux Mint/Cinnamon game-menu validation is still an on-device acceptance check

          This is a development pre-release. Local profiles do not replace Minecraft ownership or authenticated online play.
          EOF

          retry() {
            local attempt=1
            while ! "$@"; do
              if [ "$attempt" -ge 5 ]; then
                echo "Command failed after $attempt attempts: $*" >&2
                return 1
              fi
              sleep $((attempt * 3))
              attempt=$((attempt + 1))
            done
          }

          find_release_id() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG}\") | .id" 2>/dev/null | head -n1 || true
          }

          release_is_public() {
            local id="$1"
            local attempt state
            for attempt in 1 2 3 4 5; do
              state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}" \
                --jq "select(.tag_name == \"${TAG}\" and .draft == false and .prerelease == true) | .id" 2>/dev/null || true)"
              if [ "$state" = "$id" ]; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          assets_are_present() {
            local id="$1"
            local names expected
            names="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${id}/assets?per_page=100" \
              --jq '.[].name' 2>/dev/null || true)"
            for expected in release-assets/*; do
              basename "$expected"
            done | while read -r expected; do
              echo "$names" | grep -Fxq "$expected" || exit 1
            done
          }

          RELEASE_ID="$(find_release_id)"
          NOTES="$(cat RELEASE_NOTES.md)"

          if [ -n "$RELEASE_ID" ]; then
            if ! retry gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="UN_Nexo ${TAG}" \
              -f body="$NOTES" \
              -F prerelease=true \
              -F draft=false >/dev/null; then
              if ! release_is_public "$RELEASE_ID"; then
                exit 1
              fi
              echo "Release API response failed, but GitHub confirms the release is public."
            fi

            if ! retry gh release upload "$TAG" release-assets/* --clobber; then
              if ! assets_are_present "$RELEASE_ID"; then
                exit 1
              fi
              echo "Upload response failed, but every expected asset is present."
            fi
          else
            if ! retry gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "UN_Nexo ${TAG}" \
              --notes-file RELEASE_NOTES.md \
              --prerelease; then
              RELEASE_ID="$(find_release_id)"
              if [ -z "$RELEASE_ID" ] || ! release_is_public "$RELEASE_ID" || ! assets_are_present "$RELEASE_ID"; then
                exit 1
              fi
              echo "Create response failed, but GitHub confirms the public release and all assets."
            fi
          fi
