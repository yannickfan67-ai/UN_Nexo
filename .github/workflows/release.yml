name: release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64 single-file build
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force release | Out-Null
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64
          Copy-Item publish/win-x64/UN_Nexo.exe "release/UN_Nexo-$version-win-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  build-linux-packages:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Linux x64 build
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/linux-x64
      - name: Install package tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm xvfb
          sudo gem install --no-document fpm
      - name: Build DEB and RPM packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          BASE_VERSION="${VERSION%%-*}"
          ITERATION="${VERSION#*-}"
          if [ "$ITERATION" = "$VERSION" ]; then ITERATION="1"; fi
          mkdir -p package-root/usr/lib/un-nexo package-root/usr/bin package-root/usr/share/applications release
          cp -a publish/linux-x64/. package-root/usr/lib/un-nexo/
          find package-root/usr/lib/un-nexo -name '*.pdb' -delete
          chmod 0755 package-root/usr/lib/un-nexo/UN_Nexo
          cat > package-root/usr/bin/un-nexo <<'EOF'
          #!/bin/sh
          exec /usr/lib/un-nexo/UN_Nexo "$@"
          EOF
          chmod 0755 package-root/usr/bin/un-nexo
          cat > package-root/usr/share/applications/un-nexo.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=UN_Nexo
          Comment=Modern Minecraft launcher
          Exec=un-nexo
          Terminal=false
          Categories=Game;Utility;
          StartupNotify=true
          StartupWMClass=UN_Nexo
          EOF
          fpm -s dir -t deb -n un-nexo -v "$BASE_VERSION" --iteration "$ITERATION" -a amd64 \
            --description "UN_Nexo - a modern, lightweight and extensible Minecraft launcher" \
            --url "https://github.com/yannickfan67-ai/UN_Nexo" --maintainer "UN_Nexo project" \
            -C package-root -p "release/UN_Nexo-${VERSION}-linux-x64.deb" .
          fpm -s dir -t rpm -n un-nexo -v "$BASE_VERSION" --iteration "$ITERATION" -a x86_64 \
            --description "UN_Nexo - a modern, lightweight and extensible Minecraft launcher" \
            --url "https://github.com/yannickfan67-ai/UN_Nexo" --maintainer "UN_Nexo project" \
            -C package-root -p "release/UN_Nexo-${VERSION}-linux-x64.rpm" .
      - name: Smoke test packaged DEB UI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          rm -rf smoke-root smoke-data
          mkdir -p smoke-root smoke-data
          dpkg-deb -x "release/UN_Nexo-${VERSION}-linux-x64.deb" smoke-root
          set +e
          timeout 8s xvfb-run -a env XDG_DATA_HOME="$PWD/smoke-data" "$PWD/smoke-root/usr/lib/un-nexo/UN_Nexo" >package-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then cat package-smoke.log; exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    needs: [build-windows, build-linux-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION}"
          cat > RELEASE_NOTES.md <<EOF
          ## UN_Nexo ${VERSION}

          ### New in this build
          - Accounts page with persistent offline profiles and deterministic Minecraft offline UUIDs
          - Download source setting: Official or BMCLAPI
          - BMCLAPI acceleration for version metadata, client files, libraries and assets
          - Automatic fallback to official Mojang/Minecraft URLs when a mirror request fails
          - SHA-1 verification remains enabled regardless of source
          - Linux DEB/RPM packaging now includes Avalonia native SkiaSharp/HarfBuzz libraries
          - Packaged DEB is actually launched under Xvfb before the release is published

          ### Microsoft account status
          The Microsoft/Xbox/XSTS authentication path is being prepared, but Minecraft Services requires third-party application registration approval/allowlisting. UN_Nexo will only ship Microsoft sign-in with its own approved client ID; it will not reuse or spoof another launcher's ID.

          ### Current limitations
          - Play/launch pipeline is still under development
          - Microsoft account sign-in is not enabled in this build yet
          - Fabric, Forge and NeoForge installers are not included yet

          Offline profiles are intended for local worlds, development and offline-mode servers; they are not a replacement for Minecraft ownership or authenticated online play.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "UN_Nexo ${TAG}" --notes-file RELEASE_NOTES.md --prerelease
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "UN_Nexo ${TAG}" --notes-file RELEASE_NOTES.md --prerelease
          fi
