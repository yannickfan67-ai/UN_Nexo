name: release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-core:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run launch and download regression checks
        run: dotnet run --project tests/UN.Nexo.Core.Tests/UN.Nexo.Core.Tests.csproj -c Release

  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64 single-file build
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force release | Out-Null
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64
          Copy-Item publish/win-x64/UN_Nexo.exe "release/UN_Nexo-$version-win-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  build-linux-packages:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Linux x64 build
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/linux-x64
      - name: Install package tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm xvfb
          sudo gem install --no-document fpm
      - name: Build DEB and RPM packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          BASE_VERSION="${VERSION%%-*}"
          ITERATION="${VERSION#*-}"
          if [ "$ITERATION" = "$VERSION" ]; then ITERATION="1"; fi
          mkdir -p package-root/usr/lib/un-nexo package-root/usr/bin package-root/usr/share/applications release
          cp -a publish/linux-x64/. package-root/usr/lib/un-nexo/
          find package-root/usr/lib/un-nexo -name '*.pdb' -delete
          chmod 0755 package-root/usr/lib/un-nexo/UN_Nexo
          cat > package-root/usr/bin/un-nexo <<'EOF'
          #!/bin/sh
          exec /usr/lib/un-nexo/UN_Nexo "$@"
          EOF
          chmod 0755 package-root/usr/bin/un-nexo
          cat > package-root/usr/share/applications/un-nexo.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=UN_Nexo
          Comment=Modern Minecraft launcher
          Exec=un-nexo
          Terminal=false
          Categories=Game;Utility;
          StartupNotify=true
          StartupWMClass=UN_Nexo
          EOF
          fpm -s dir -t deb -n un-nexo -v "$BASE_VERSION" --iteration "$ITERATION" -a amd64 \
            --description "UN_Nexo - a modern, lightweight and extensible Minecraft launcher" \
            --url "https://github.com/yannickfan67-ai/UN_Nexo" --maintainer "UN_Nexo project" \
            -d 'libc6 (>= 2.35)' -d libgcc-s1 -d libstdc++6 \
            -d libfontconfig1 -d libfreetype6 \
            -d libx11-6 -d libx11-xcb1 -d libxcb1 -d libxext6 \
            -d libxi6 -d libxrandr2 -d libxcursor1 -d libgl1 -d libice6 -d libsm6 \
            -C package-root -p "release/UN_Nexo-${VERSION}-linux-x64.deb" .
          fpm -s dir -t rpm -n un-nexo -v "$BASE_VERSION" --iteration "$ITERATION" -a x86_64 \
            --description "UN_Nexo - a modern, lightweight and extensible Minecraft launcher" \
            --url "https://github.com/yannickfan67-ai/UN_Nexo" --maintainer "UN_Nexo project" \
            -d glibc -d libgcc -d libstdc++ -d fontconfig -d freetype \
            -d libX11 -d libXcursor -d libXi -d libXrandr -d libXext -d mesa-libGL -d libICE -d libSM \
            -C package-root -p "release/UN_Nexo-${VERSION}-linux-x64.rpm" .
      - name: Validate DEB dependencies with APT
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          DEB="UN_Nexo-${VERSION}-linux-x64.deb"
          echo "Declared dependencies:"
          dpkg-deb -f "release/$DEB" Depends
          docker run --rm -v "$PWD/release:/packages:ro" ubuntu:24.04 bash -lc \
            "apt-get update >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/$DEB >/dev/null && dpkg-query -W -f='\${Status}\n' un-nexo | grep -q 'install ok installed'"
      - name: Smoke test packaged DEB UI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          rm -rf smoke-root smoke-data
          mkdir -p smoke-root smoke-data
          dpkg-deb -x "release/UN_Nexo-${VERSION}-linux-x64.deb" smoke-root
          set +e
          timeout 8s xvfb-run -a env XDG_DATA_HOME="$PWD/smoke-data" "$PWD/smoke-root/usr/lib/un-nexo/UN_Nexo" >package-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then cat package-smoke.log; exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    needs: [test-core, build-windows, build-linux-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION}"
          cat > RELEASE_NOTES.md <<EOF
          ## UN_Nexo ${VERSION}

          ### New in this build
          - Prepared Vanilla instances can now be launched with a local/offline profile
          - Minecraft-required Java major version is selected automatically from detected 64-bit runtimes
          - Modern and legacy launch metadata are supported, including 1.21.4-style arguments and 1.8.9-style minecraftArguments
          - Game stdout/stderr is captured to per-launch logs with recent output visible in Nexo
          - Stop game terminates the launched Java process tree
          - Paths containing spaces are passed safely through ProcessStartInfo.ArgumentList
          - BMCLAPI manifest fallback now also recovers from interrupted HTTP-200 response bodies
          - CI includes regression fixtures for Java 8/17/21 parsing, mirror streaming fallback and modern/legacy launch plans

          ### Packaging checks
          - Linux DEB/RPM include required native launcher dependencies
          - The DEB is installed with APT in a clean Ubuntu 24.04 container
          - The packaged DEB is launched under Xvfb before publishing
          - Windows and Linux packages remain self-contained for the .NET runtime

          ### Current limitations
          - Microsoft account sign-in is not enabled yet while UN_Nexo obtains its own approved application registration
          - Local/offline profiles are not authenticated Microsoft accounts and cannot join online-mode servers
          - Fabric, Forge and NeoForge installers are not included yet
          - HTTP Range resume and mod/resource-pack/shader management are not implemented yet
          - Real Linux Mint/Cinnamon game-menu validation is still an on-device acceptance check

          This is a development pre-release. Local/offline profiles do not replace Minecraft ownership or authenticated online play.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "UN_Nexo ${TAG}" --notes-file RELEASE_NOTES.md --prerelease
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "UN_Nexo ${TAG}" --notes-file RELEASE_NOTES.md --prerelease
          fi
