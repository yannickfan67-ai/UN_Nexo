name: release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore UN_Nexo.sln
      - name: Build
        run: dotnet build UN_Nexo.sln -c Release --no-restore
      - name: Core regression checks
        run: dotnet run --project tests/UN.Nexo.Core.Tests/UN.Nexo.Core.Tests.csproj -c Release --no-build
      - name: Diagnostics regression checks
        run: dotnet run --project tests/UN.Nexo.Diagnostics.Tests/UN.Nexo.Diagnostics.Tests.csproj -c Release
      - name: Server status regression checks
        run: dotnet run --project tests/UN.Nexo.ServerStatus.Tests/UN.Nexo.ServerStatus.Tests.csproj -c Release
      - name: Instance lifecycle regression checks
        run: dotnet run --project tests/UN.Nexo.InstanceLifecycle.Tests/UN.Nexo.InstanceLifecycle.Tests.csproj -c Release
      - name: Game directory import regression checks
        run: dotnet run --project tests/UN.Nexo.Import.Tests/UN.Nexo.Import.Tests.csproj -c Release
      - name: Fabric inheritance regression checks
        run: dotnet run --project tests/UN.Nexo.Fabric.Tests/UN.Nexo.Fabric.Tests.csproj -c Release
      - name: Stability regression checks
        run: dotnet run --project tests/UN.Nexo.Stability.Tests/UN.Nexo.Stability.Tests.csproj -c Release
      - name: Instance repair regression checks
        run: dotnet run --project tests/UN.Nexo.Repair.Tests/UN.Nexo.Repair.Tests.csproj -c Release

  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64 single-file build
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force release | Out-Null
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64
          Copy-Item publish/win-x64/UN_Nexo.exe "release/UN_Nexo-$version-win-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  build-linux-packages:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Linux x64 build
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/linux-x64
      - name: Install package tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm xvfb
          sudo gem install --no-document fpm
      - name: Build DEB and RPM packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          BASE_VERSION="${VERSION%%-*}"
          ITERATION="${VERSION#*-}"
          if [ "$ITERATION" = "$VERSION" ]; then ITERATION="1"; fi
          mkdir -p package-root/usr/lib/un-nexo package-root/usr/bin package-root/usr/share/applications release
          cp -a publish/linux-x64/. package-root/usr/lib/un-nexo/
          find package-root/usr/lib/un-nexo -name '*.pdb' -delete
          chmod 0755 package-root/usr/lib/un-nexo/UN_Nexo
          cat > package-root/usr/bin/un-nexo <<'EOF'
          #!/bin/sh
          exec /usr/lib/un-nexo/UN_Nexo "$@"
          EOF
          chmod 0755 package-root/usr/bin/un-nexo
          cat > package-root/usr/share/applications/un-nexo.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=UN_Nexo
          Comment=Modern Minecraft launcher
          Exec=un-nexo
          Terminal=false
          Categories=Game;Utility;
          StartupNotify=true
          StartupWMClass=UN_Nexo
          EOF
          fpm -s dir -t deb -n un-nexo -v "$BASE_VERSION" --iteration "$ITERATION" -a amd64 \
            --description "UN_Nexo - a modern, lightweight and extensible Minecraft launcher" \
            --url "https://github.com/yannickfan67-ai/UN_Nexo" --maintainer "UN_Nexo project" \
            -d 'libc6 (>= 2.35)' -d libgcc-s1 -d libstdc++6 \
            -d libfontconfig1 -d fontconfig -d libfreetype6 -d fonts-noto-cjk \
            -d libx11-6 -d libx11-xcb1 -d libxcb1 -d libxext6 \
            -d libxi6 -d libxtst6 -d libxrandr2 -d libxcursor1 -d libgl1 -d libice6 -d libsm6 -d libsecret-1-0 \
            -C package-root -p "release/UN_Nexo-${VERSION}-linux-x64.deb" .
          fpm -s dir -t rpm -n un-nexo -v "$BASE_VERSION" --iteration "$ITERATION" -a x86_64 \
            --description "UN_Nexo - a modern, lightweight and extensible Minecraft launcher" \
            --url "https://github.com/yannickfan67-ai/UN_Nexo" --maintainer "UN_Nexo project" \
            -d glibc -d libgcc -d libstdc++ -d fontconfig -d freetype -d google-noto-sans-cjk-fonts \
            -d libX11 -d libXcursor -d libXi -d libXtst -d libXrandr -d libXext -d mesa-libGL -d libICE -d libSM -d libsecret \
            -C package-root -p "release/UN_Nexo-${VERSION}-linux-x64.rpm" .
      - name: Validate DEB dependencies and CJK fallback with APT
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          DEB="UN_Nexo-${VERSION}-linux-x64.deb"
          dpkg-deb -f "release/$DEB" Depends
          docker run --rm -v "$PWD/release:/packages:ro" ubuntu:24.04 bash -lc \
            "apt-get update >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/$DEB >/dev/null && dpkg-query -W -f='\${Status}\n' un-nexo | grep -q 'install ok installed' && dpkg-query -W -f='\${Status}\n' libxtst6 | grep -q 'install ok installed' && dpkg-query -W -f='\${Status}\n' libsecret-1-0 | grep -q 'install ok installed' && ldconfig -p | grep -q 'libXtst.so.6' && fc-match 'Noto Sans CJK SC' | grep -qi 'NotoSansCJK'"
      - name: Smoke test packaged DEB UI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          rm -rf smoke-root smoke-data
          mkdir -p smoke-root smoke-data
          dpkg-deb -x "release/UN_Nexo-${VERSION}-linux-x64.deb" smoke-root
          set +e
          timeout 8s xvfb-run -a env XDG_DATA_HOME="$PWD/smoke-data" "$PWD/smoke-root/usr/lib/un-nexo/UN_Nexo" >package-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then cat package-smoke.log; exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    needs: [test-release, build-windows, build-linux-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION}"
          cat > RELEASE_NOTES.md <<EOF
          ## UN_Nexo ${VERSION}

          ### Lock-sidecar integrity
          - Cross-process lock ownership is now represented only by the exclusive OS file handle; lock sidecars are contentless and are no longer truncated or rewritten with metadata.
          - Persisted-store and per-instance coordination share one lock implementation and reject symlink/reparse-point sidecars before and immediately after open.
          - Real symlink regressions on Windows/Linux verify a linked lock cannot modify its target while existing contention, cancellation and crash-release behavior remains intact.

          ### Cross-process instance and store safety
          - Mod install, enable/disable and removal now participate in the shared instance operation coordinator, so another Nexo process cannot rewrite an instance while it is being played, repaired, backed up or otherwise mutated.
          - Mod-manager toggle/remove actions await the coordinated async mutation path instead of blocking the desktop UI.
          - Account and server-favorite read/modify/write transactions now serialize across cooperating Nexo processes with an OS-owned lock handle, preventing last-writer-wins lost updates.
          - Instance-name uniqueness and launcher/runtime settings publication are also coordinated across processes.
          - Regression coverage exercises same-instance waiting, two-process server-favorite additions, cancellation while queued and recovery after killing a lock-holder process.

          ### Diagnostic export hardening
          - Diagnostic preview/export now requires explicit trusted log roots instead of treating any existing caller-provided path as eligible.
          - Symlink/reparse-point source files and linked parent components are rejected, and source authorization is revalidated immediately before every log read.
          - Windows and Linux regressions cover an allowed-root symlink targeting an outside secret plus replacement of a previously previewed regular log with a symlink before export.
          - Existing bounded-tail limits, token/home-path sanitization and atomic ZIP replacement remain in place.

          ### Microsoft account status
          - The launcher continues to use UN_Nexo's own Microsoft public-client registration and the Microsoft -> Xbox Live -> XSTS -> Minecraft Services chain.
          - A Minecraft Services `403 Invalid app registration` now points directly to the official AppID review route: https://aka.ms/mce-reviewappid.
          - Token-bearing authentication errors remain redacted and a rejected AppID still rolls back the cached Microsoft identity instead of publishing a half-authenticated account.
          - Live Microsoft/Minecraft acceptance remains tracked in #22 until the UN_Nexo Client ID is approved by Minecraft Services and a licensed real account completes sign-in plus launch.

          ### Avalonia 12 maintenance
          - Replaces obsolete TextBox `Watermark` and Window `SystemDecorations` XAML properties with their Avalonia 12 equivalents.
          - The Linux compiler warning count from these deprecated properties is removed; the remaining XAML loader warnings are the two dependency-injected windows that intentionally have no public parameterless constructor.

          ### Packaging and regression coverage
          - Windows and Ubuntu build/regression matrices remain green after the concurrency and authentication changes.
          - Linux desktop Xvfb smoke and the self-contained Windows x64 portable publish remain part of pull-request validation.
          - Release CI still runs Core, Diagnostics, Server Status, Instance Lifecycle, Import, Fabric, Stability and Repair regressions before publication.

          ### Current limitations
          - Microsoft account code is implemented, but live Minecraft Services use still depends on Minecraft approving the registered UN_Nexo Client ID and real-account acceptance. UN_Nexo will not borrow another launcher's Client ID.
          - Fabric preparation/repair is available; Forge and NeoForge installers are not included yet.
          - HTTP Range resume, per-instance runtime overrides and friend-to-friend room-code/P2P networking are not included yet.
          - Modrinth-compatible mod management is available; resource-pack/shader management is not included yet.
          - Real Linux Mint/Cinnamon behavior remains an on-device acceptance check.

          This is a development pre-release. Local/offline profiles do not replace Minecraft ownership or authenticated online play.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "UN_Nexo $TAG" --notes-file RELEASE_NOTES.md --prerelease
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "UN_Nexo $TAG" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
