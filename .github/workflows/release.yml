name: release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore UN_Nexo.sln
      - name: Build
        run: dotnet build UN_Nexo.sln -c Release --no-restore
      - name: Core regression checks
        run: dotnet run --project tests/UN.Nexo.Core.Tests/UN.Nexo.Core.Tests.csproj -c Release --no-build
      - name: Diagnostics regression checks
        run: dotnet run --project tests/UN.Nexo.Diagnostics.Tests/UN.Nexo.Diagnostics.Tests.csproj -c Release
      - name: Server status regression checks
        run: dotnet run --project tests/UN.Nexo.ServerStatus.Tests/UN.Nexo.ServerStatus.Tests.csproj -c Release
      - name: Instance lifecycle regression checks
        run: dotnet run --project tests/UN.Nexo.InstanceLifecycle.Tests/UN.Nexo.InstanceLifecycle.Tests.csproj -c Release
      - name: Game directory import regression checks
        run: dotnet run --project tests/UN.Nexo.Import.Tests/UN.Nexo.Import.Tests.csproj -c Release
      - name: Fabric inheritance regression checks
        run: dotnet run --project tests/UN.Nexo.Fabric.Tests/UN.Nexo.Fabric.Tests.csproj -c Release
      - name: Stability regression checks
        run: dotnet run --project tests/UN.Nexo.Stability.Tests/UN.Nexo.Stability.Tests.csproj -c Release
      - name: Instance repair regression checks
        run: dotnet run --project tests/UN.Nexo.Repair.Tests/UN.Nexo.Repair.Tests.csproj -c Release

  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64 single-file build
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force release | Out-Null
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64
          Copy-Item publish/win-x64/UN_Nexo.exe "release/UN_Nexo-$version-win-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  build-linux-packages:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Linux x64 build
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/linux-x64
      - name: Install package tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm xvfb
          sudo gem install --no-document fpm
      - name: Build DEB and RPM packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          BASE_VERSION="${VERSION%%-*}"
          ITERATION="${VERSION#*-}"
          if [ "$ITERATION" = "$VERSION" ]; then ITERATION="1"; fi
          mkdir -p package-root/usr/lib/un-nexo package-root/usr/bin package-root/usr/share/applications release
          cp -a publish/linux-x64/. package-root/usr/lib/un-nexo/
          find package-root/usr/lib/un-nexo -name '*.pdb' -delete
          chmod 0755 package-root/usr/lib/un-nexo/UN_Nexo
          cat > package-root/usr/bin/un-nexo <<'EOF'
          #!/bin/sh
          exec /usr/lib/un-nexo/UN_Nexo "$@"
          EOF
          chmod 0755 package-root/usr/bin/un-nexo
          cat > package-root/usr/share/applications/un-nexo.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=UN_Nexo
          Comment=Modern Minecraft launcher
          Exec=un-nexo
          Terminal=false
          Categories=Game;Utility;
          StartupNotify=true
          StartupWMClass=UN_Nexo
          EOF
          fpm -s dir -t deb -n un-nexo -v "$BASE_VERSION" --iteration "$ITERATION" -a amd64 \
            --description "UN_Nexo - a modern, lightweight and extensible Minecraft launcher" \
            --url "https://github.com/yannickfan67-ai/UN_Nexo" --maintainer "UN_Nexo project" \
            -d 'libc6 (>= 2.35)' -d libgcc-s1 -d libstdc++6 \
            -d libfontconfig1 -d fontconfig -d libfreetype6 -d fonts-noto-cjk \
            -d libx11-6 -d libx11-xcb1 -d libxcb1 -d libxext6 \
            -d libxi6 -d libxtst6 -d libxrandr2 -d libxcursor1 -d libgl1 -d libice6 -d libsm6 -d libsecret-1-0 \
            -C package-root -p "release/UN_Nexo-${VERSION}-linux-x64.deb" .
          fpm -s dir -t rpm -n un-nexo -v "$BASE_VERSION" --iteration "$ITERATION" -a x86_64 \
            --description "UN_Nexo - a modern, lightweight and extensible Minecraft launcher" \
            --url "https://github.com/yannickfan67-ai/UN_Nexo" --maintainer "UN_Nexo project" \
            -d glibc -d libgcc -d libstdc++ -d fontconfig -d freetype -d google-noto-sans-cjk-fonts \
            -d libX11 -d libXcursor -d libXi -d libXtst -d libXrandr -d libXext -d mesa-libGL -d libICE -d libSM -d libsecret \
            -C package-root -p "release/UN_Nexo-${VERSION}-linux-x64.rpm" .
      - name: Validate DEB dependencies and CJK fallback with APT
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          DEB="UN_Nexo-${VERSION}-linux-x64.deb"
          dpkg-deb -f "release/$DEB" Depends
          docker run --rm -v "$PWD/release:/packages:ro" ubuntu:24.04 bash -lc \
            "apt-get update >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/$DEB >/dev/null && dpkg-query -W -f='\${Status}\n' un-nexo | grep -q 'install ok installed' && dpkg-query -W -f='\${Status}\n' libxtst6 | grep -q 'install ok installed' && dpkg-query -W -f='\${Status}\n' libsecret-1-0 | grep -q 'install ok installed' && ldconfig -p | grep -q 'libXtst.so.6' && fc-match 'Noto Sans CJK SC' | grep -qi 'NotoSansCJK'"
      - name: Smoke test packaged DEB UI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          rm -rf smoke-root smoke-data
          mkdir -p smoke-root smoke-data
          dpkg-deb -x "release/UN_Nexo-${VERSION}-linux-x64.deb" smoke-root
          set +e
          timeout 8s xvfb-run -a env XDG_DATA_HOME="$PWD/smoke-data" "$PWD/smoke-root/usr/lib/un-nexo/UN_Nexo" >package-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then cat package-smoke.log; exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    needs: [test-release, build-windows, build-linux-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION}"
          cat > RELEASE_NOTES.md <<EOF
          ## UN_Nexo ${VERSION}

          ### Security and authentication hardening in 0.7.6-dev
          - Adds UN_Nexo's own Microsoft public-client sign-in flow, Xbox/XSTS/Minecraft Services exchange, OS-backed refresh credential storage, silent refresh, sign-out and token redaction without borrowing another launcher's Client ID.
          - Rejects credential-bearing authentication redirects before they can be followed and bounds stalled authentication response bodies.
          - Expands path containment and typed-metadata validation across Vanilla, Fabric, Repair, Import, managed Java, Modrinth and asset-index handling.
          - Constrains metadata-driven download targets, redirect destinations and archive extraction so untrusted metadata cannot escape managed roots or silently redirect required artifacts to arbitrary endpoints.

          ### Vanilla, Fabric and launch integrity
          - Vanilla Prepare now validates version identity plus required client/asset-index metadata before publishing prepared state, downloads declared logging configuration, and supports legacy Maven-name libraries through trusted checksum sidecars.
          - Hashless required binaries are no longer treated as verified merely because a file exists; declared sizes/content lengths are enforced and SHA-1 metadata is validated when available.
          - Launch verifies client/library/native/asset integrity, repairs same-size corruption in virtual/resources-derived assets, and rejects incomplete or stale extracted native runtimes before Java starts.
          - Native classifier archives are rebuilt into an operation-unique staging tree and atomically replace the version native directory, removing stale files left by changed metadata.
          - Inherited metadata now replaces parent Maven versions by logical artifact identity while keeping distinct classifiers/extensions, improving Fabric classpaths and inherited Quick Play/Repair behavior.
          - ARM64/aarch64 rule handling and launcher feature-rule evaluation are aligned with the runtime model.

          ### Import, backup, diagnostics and server reliability
          - Import rejects sources overlapping Nexo's managed data root and isolates wrong-typed version metadata without aborting healthy sibling discovery.
          - World backups use bounded manifests and per-file integrity metadata; restore rejects missing, unexpected or same-size corrupted files before publishing a save.
          - Install state and diagnostic ZIP replacement are atomic; diagnostic preview explicitly discloses that it is a bounded sanitized excerpt and states the export limits.
          - Server Hub preserves stale default-instance links as an actionable error instead of launching a different selected instance, resolves Minecraft Java SRV records for hostname-only targets, and keeps valid status data when optional latency ping times out.
          - Minecraft process tracking, launcher logs, managed Java publication/provisioning and persisted account/server stores received additional isolation, bounds and corruption handling.

          ### Instance-scoped concurrency
          - Vanilla/Fabric Prepare, Repair, Clone, Backup/Restore, normal Play and Server Hub now share one instance operation coordinator.
          - Different instances remain concurrent, while same-instance mutations are serialized by canonical instance path and cooperating Nexo processes also coordinate through a per-instance FileShare.None lock.
          - Per-instance install cancellation replaces the old process-local global prepare gate, and closing backup/clone workflows cancels and cleans staged work instead of leaving a detached mutation running.
          - Play and Server Hub hold the instance lease for the Minecraft process lifetime so Nexo cannot restore, repair or rewrite the same instance underneath a running game.

          ### Modrinth integration carried forward from 0.7.5-dev
          - Installed / Modrinth browsing remains available per instance using the public Modrinth API with no private API key or closed backend.
          - Compatible projects are filtered by the selected Minecraft version and loader; managed JARs are matched by SHA-1 and explicit install/update actions verify provider filename, CDN host, declared size and SHA-1 before publication.
          - Disabled state is preserved during explicit managed updates and local Install JAR remains available.

          ### Packaging and regression coverage
          - Release CI runs Core, Diagnostics, Server Status, Instance Lifecycle, Import, Fabric, Stability and Repair regressions before publication.
          - Windows x64 remains a self-contained single-file build; Linux x64 publishes DEB and RPM packages with dependency validation and an Xvfb UI smoke test.
          - 0.7.6-dev includes the accumulated fixes for the security, integrity, compatibility and reliability issues closed since 0.7.5-dev, including auth redirect/body safety, asset/library/native integrity, metadata shape validation, import containment, backup integrity and instance-operation races.

          ### Current limitations
          - Microsoft account code is implemented, but live Minecraft Services acceptance still depends on the registered UN_Nexo Client ID being authorized by the service. Real-account sign-in/launch remains an external acceptance item tracked in #22.
          - Forge support is still under development and is not included in this release.
          - Dedicated Sodium/Iris compatibility presets are not included yet; compatible releases can be found and installed through Modrinth.
          - Per-instance runtime overrides and friend-to-friend room-code/P2P networking are not implemented yet.
          - Real Linux Mint/Cinnamon game-menu behavior remains an on-device acceptance check.

          This is a development pre-release. Local/offline profiles do not replace Minecraft ownership or authenticated online play.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "UN_Nexo $TAG" --notes-file RELEASE_NOTES.md --prerelease
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "UN_Nexo $TAG" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
