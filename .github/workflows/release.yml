name: release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore UN_Nexo.sln
      - name: Build
        run: dotnet build UN_Nexo.sln -c Release --no-restore
      - name: Core regression checks
        run: dotnet run --project tests/UN.Nexo.Core.Tests/UN.Nexo.Core.Tests.csproj -c Release --no-build
      - name: Diagnostics regression checks
        run: dotnet run --project tests/UN.Nexo.Diagnostics.Tests/UN.Nexo.Diagnostics.Tests.csproj -c Release
      - name: Server status regression checks
        run: dotnet run --project tests/UN.Nexo.ServerStatus.Tests/UN.Nexo.ServerStatus.Tests.csproj -c Release
      - name: Instance lifecycle regression checks
        run: dotnet run --project tests/UN.Nexo.InstanceLifecycle.Tests/UN.Nexo.InstanceLifecycle.Tests.csproj -c Release
      - name: Game directory import regression checks
        run: dotnet run --project tests/UN.Nexo.Import.Tests/UN.Nexo.Import.Tests.csproj -c Release
      - name: Fabric inheritance regression checks
        run: dotnet run --project tests/UN.Nexo.Fabric.Tests/UN.Nexo.Fabric.Tests.csproj -c Release
      - name: Stability regression checks
        run: dotnet run --project tests/UN.Nexo.Stability.Tests/UN.Nexo.Stability.Tests.csproj -c Release
      - name: Instance repair regression checks
        run: dotnet run --project tests/UN.Nexo.Repair.Tests/UN.Nexo.Repair.Tests.csproj -c Release

  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64 single-file build
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force release | Out-Null
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64
          Copy-Item publish/win-x64/UN_Nexo.exe "release/UN_Nexo-$version-win-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  build-linux-packages:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Linux x64 build
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/UN.Nexo.Desktop/UN.Nexo.Desktop.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/linux-x64
      - name: Install package tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm xvfb
          sudo gem install --no-document fpm
      - name: Build DEB and RPM packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          BASE_VERSION="${VERSION%%-*}"
          ITERATION="${VERSION#*-}"
          if [ "$ITERATION" = "$VERSION" ]; then ITERATION="1"; fi
          mkdir -p package-root/usr/lib/un-nexo package-root/usr/bin package-root/usr/share/applications release
          cp -a publish/linux-x64/. package-root/usr/lib/un-nexo/
          find package-root/usr/lib/un-nexo -name '*.pdb' -delete
          chmod 0755 package-root/usr/lib/un-nexo/UN_Nexo
          cat > package-root/usr/bin/un-nexo <<'EOF'
          #!/bin/sh
          exec /usr/lib/un-nexo/UN_Nexo "$@"
          EOF
          chmod 0755 package-root/usr/bin/un-nexo
          cat > package-root/usr/share/applications/un-nexo.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=UN_Nexo
          Comment=Modern Minecraft launcher
          Exec=un-nexo
          Terminal=false
          Categories=Game;Utility;
          StartupNotify=true
          StartupWMClass=UN_Nexo
          EOF
          fpm -s dir -t deb -n un-nexo -v "$BASE_VERSION" --iteration "$ITERATION" -a amd64 \
            --description "UN_Nexo - a modern, lightweight and extensible Minecraft launcher" \
            --url "https://github.com/yannickfan67-ai/UN_Nexo" --maintainer "UN_Nexo project" \
            -d 'libc6 (>= 2.35)' -d libgcc-s1 -d libstdc++6 \
            -d libfontconfig1 -d fontconfig -d libfreetype6 -d fonts-noto-cjk \
            -d libx11-6 -d libx11-xcb1 -d libxcb1 -d libxext6 \
            -d libxi6 -d libxtst6 -d libxrandr2 -d libxcursor1 -d libgl1 -d libice6 -d libsm6 -d libsecret-1-0 \
            -C package-root -p "release/UN_Nexo-${VERSION}-linux-x64.deb" .
          fpm -s dir -t rpm -n un-nexo -v "$BASE_VERSION" --iteration "$ITERATION" -a x86_64 \
            --description "UN_Nexo - a modern, lightweight and extensible Minecraft launcher" \
            --url "https://github.com/yannickfan67-ai/UN_Nexo" --maintainer "UN_Nexo project" \
            -d glibc -d libgcc -d libstdc++ -d fontconfig -d freetype -d google-noto-sans-cjk-fonts \
            -d libX11 -d libXcursor -d libXi -d libXtst -d libXrandr -d libXext -d mesa-libGL -d libICE -d libSM -d libsecret \
            -C package-root -p "release/UN_Nexo-${VERSION}-linux-x64.rpm" .
      - name: Validate DEB dependencies and CJK fallback with APT
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          DEB="UN_Nexo-${VERSION}-linux-x64.deb"
          dpkg-deb -f "release/$DEB" Depends
          docker run --rm -v "$PWD/release:/packages:ro" ubuntu:24.04 bash -lc \
            "apt-get update >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/$DEB >/dev/null && dpkg-query -W -f='\${Status}\n' un-nexo | grep -q 'install ok installed' && dpkg-query -W -f='\${Status}\n' libxtst6 | grep -q 'install ok installed' && dpkg-query -W -f='${Status}\n' libsecret-1-0 | grep -q 'install ok installed' && ldconfig -p | grep -q 'libXtst.so.6' && fc-match 'Noto Sans CJK SC' | grep -qi 'NotoSansCJK'"
      - name: Smoke test packaged DEB UI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          rm -rf smoke-root smoke-data
          mkdir -p smoke-root smoke-data
          dpkg-deb -x "release/UN_Nexo-${VERSION}-linux-x64.deb" smoke-root
          set +e
          timeout 8s xvfb-run -a env XDG_DATA_HOME="$PWD/smoke-data" "$PWD/smoke-root/usr/lib/un-nexo/UN_Nexo" >package-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then cat package-smoke.log; exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    needs: [test-release, build-windows, build-linux-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION}"
          cat > RELEASE_NOTES.md <<EOF
          ## UN_Nexo ${VERSION}

          ### Security fix in 0.7.1-dev
          - Rejects imported Fabric `downloads.artifact.path` values that escape the selected instance's `game/libraries` directory, including traversal and rooted paths, before any HTTP request or file write.

          ### Modrinth integration in 0.7.5-dev
          - Adds an Installed / Modrinth view to the per-instance Mods manager.
          - Searches the public Modrinth API using the selected Minecraft version and loader, with no private API key or closed backend.
          - Matches existing managed JARs by SHA-1, reports compatible updates, and only changes files after an explicit Install/Update action.
          - Verifies provider filename, HTTPS CDN host, declared size and SHA-1 before publishing a downloaded JAR through Nexo's existing path-safe mod service.
          - Preserves disabled state when explicitly updating a disabled Modrinth-managed mod and keeps local Install JAR support available.

          ### Fabric and instance management
          - Adds launch support for inherited Minecraft version profiles and Fabric Loader/KnotClient.
          - Adds a Fabric Manager that queries compatible loader versions, creates isolated Fabric instances, and prepares imported Fabric profiles.
          - Keeps loader libraries, mods and game data scoped to the selected Nexo instance.

          ### Import, backup and recovery
          - Imports existing .minecraft/game directories through a scan-and-preview flow while leaving the source untouched.
          - Adds independent instance cloning plus manual world backup and restore with staging and restore-safety copies.
          - Rejects incomplete or size-mismatched world backup archives before replacing the active save.

          ### Server and diagnostics improvements
          - Adds live Java server status, latency, player counts, protocol-aware compatibility hints and default-instance links in Server Hub.
          - Adds persistent crash diagnosis, sanitized diagnostic previews and bounded ZIP diagnostic export.
          - Bundles a CJK fallback font so portable/Linux builds do not depend solely on host CJK fonts.

          ### Runtime and reliability hardening
          - Blocks JVM argument-file, classpath, heap-limit and alternate module/JAR entry-point bypasses of launcher-managed options.
          - Preserves startup tracing, bounded network operations, repair checks, Java runtime validation and download fallback behavior.
          - Release CI now runs Core, Diagnostics, Server Status, Instance Lifecycle, Import, Fabric, Stability and Repair regressions before publishing.
          - Windows and Linux packages remain self-contained for the .NET runtime; Linux DEB packaging is installed and UI-smoke-tested under Xvfb.

          ### Current limitations
          - Microsoft account sign-in is not enabled yet while UN_Nexo obtains its own approved Microsoft application registration.
          - Forge support is still under development and is not included in this release.
          - Dedicated Sodium/Iris compatibility presets are not included yet; compatible releases can now be found and installed through Modrinth.
          - Per-instance runtime overrides and friend-to-friend room-code/P2P networking are not implemented yet.
          - Real Linux Mint/Cinnamon game-menu behavior remains an on-device acceptance check.

          This is a development pre-release. Local/offline profiles do not replace Minecraft ownership or authenticated online play.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "UN_Nexo $TAG" --notes-file RELEASE_NOTES.md --prerelease
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "UN_Nexo $TAG" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
